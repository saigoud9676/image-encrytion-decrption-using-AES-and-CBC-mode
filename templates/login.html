<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, rgb(255, 252, 252), rgba(0, 0, 0, 0.6)), url('https://via.placeholder.com/1600x900') center center no-repeat;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            font-size: 18px;
        }

        .navbar .brand {
            font-size: 36px;
            font-weight: bold;
            color: #110d0d;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            transition: all 0.4s ease;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .navbar .nav-links a {
            color: #161515;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            transition: all 0.4s ease;
            position: relative;
            text-transform: uppercase;
            font-weight: 500;
        }

        .navbar .nav-links a:hover {
            color: #f8f8f5;
        }

        .navbar .nav-links a::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(0);
            width: 100%;
            height: 2px;
            background: #ffffff;
            transition: all 0.4s ease;
        }

        .navbar .nav-links a:hover::before {
            transform: translate(-50%, -50%) scaleX(1);
        }

        /* Login Form Container */
        .login-container {
            background: rgba(255, 255, 255, 0.625);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            transform: translateY(-100px);
            opacity: 0;
            animation: fadeInUp 0.7s forwards;
        }

        /* Keyframe Animation for Form Appearance */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(-100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            text-align: center;
            font-size: 36px;
            color: #201f1c;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }

        .login-container label {
            font-size: 16px;
            color: #131212;
            margin-bottom: 8px;
            display: block;
        }

        .login-container input {
            padding: 15px;
            margin-bottom: 20px;
            font-size: 16px;
            border-radius: 50px;
            border: 2px solid #110f0f;
            background: transparent;
            color: #121010;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgb(24, 24, 24);
        }

        .login-container input:focus {
            border-color: #858481;
            box-shadow: 0 0 20px rgba(189, 189, 187, 0.8);
        }

        .login-container button {
            padding: 15px;
            font-size: 18px;
            width: 100%;
            border-radius: 50px;
            background: linear-gradient(45deg, #161616, #50504f);
            border: none;
            color: #fff;
            font-weight: bold;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .login-container button:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #696867, #353534);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .login-container p {
            text-align: center;
            color: #fff;
            margin-top: 20px;
        }

        .login-container p a {
            color: #1e1e1d;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.4s ease;
        }

        .login-container p a:hover {
            color: #545352;
            text-decoration: underline;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px;
                margin: 20px;
            }

            .navbar .brand {
                font-size: 28px;
            }

            .navbar .nav-links a {
                font-size: 16px;
                margin-left: 10px;
            }
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#" class="brand">
            <i class="fas fa-lock"></i> Encrypt/Decrypt
        </a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>

    <!-- Login Form Container -->
    <div class="login-container">
        <h1>Login</h1>
        <form method="POST">
            <label for="username">
                <i class="fas fa-user"></i> Username
            </label>
            <input type="text" name="username" required><br>

            <label for="password">
                <i class="fas fa-key"></i> Password
            </label>
            <input type="password" name="password" required><br>

            <button type="submit">Login</button>
        </form>
        <p><a href="{{ url_for('register') }}">Don't have an account? Register here.</a></p>
    </div>
    <script>
        function validateLogin(event) {
            event.preventDefault();  // Prevent form submission
            
            // Get the form data
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            // Perform login validation (You can add more complex logic here)
            if (username === "user" && password === "password") {
                // Redirect to index.html after successful login
                window.location.href = "index.html";
            } else {
                alert("Invalid credentials. Please try again.");
            }
        }
    </script>

</body>
</html>
